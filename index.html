  <script>
    const SUPABASE_URL = 'https://pfslgeehnliczddigdtw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_X6qLBG-YzlQExyDq6Wix_Q_rzc5g77b';
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const STORAGE_BUCKET = 'menu-images';
    let settings = {}, items = [], sections = [], activeCategory = null, currentEditId = null;
    let isAdminUnlocked = sessionStorage.getItem('ruknAdminUnlocked') === 'yes';
    let cart = {};
    try { cart = JSON.parse(sessionStorage.getItem('ruknCart')||'{}') || {}; } catch(e){ cart = {}; }
    function saveCart(){ try{ sessionStorage.setItem('ruknCart', JSON.stringify(cart)); }catch(e){} }
    function cartList(){ return Object.values(cart).filter(x=>x && x.qty>0); }
    function cartCount(){ return cartList().reduce((s,x)=>s+(x.qty||0),0); }
    function cartTotals(){
      let t=0, s=0;
      cartList().forEach(x=>{ t+=(Number(x.price_try)||0)*(x.qty||0); s+=(Number(x.price_syp)||0)*(x.qty||0); });
      return { try:t, syp:s };
    }
    function formatMoney(tryAmt, sypAmt){
      const a = Number(tryAmt)||0, b=Number(sypAmt)||0;
      if(a>0 && b>0) return a+' ₺ | '+b+' ل.س';
      if(a>0) return a+' ₺';
      if(b>0) return b+' ل.س';
      return '0';
    }
    function updateCartUI(){
      const n=cartCount();
      const tot=cartTotals();
      const bar=document.getElementById('floatingCart');
      const badge=document.getElementById('cartCountBadge');
      const totalEl=document.getElementById('cartTotalBar');
      const grand=document.getElementById('cartGrandTotal');
      if(badge) badge.textContent=String(n);
      const money=formatMoney(tot.try, tot.syp);
      if(totalEl) totalEl.textContent=money;
      if(grand) grand.textContent=money;
      if(bar){ if(n>0) bar.classList.add('show'); else bar.classList.remove('show'); }

    function openEditItem(id,defCat,defIcon){currentEditId=id;const modal=document.getElementById('editItemModal');if(id){const item=items.find(i=>i.id===id);if(!item)return;document.getElementById('editItemTitle').textContent='تعديل: '+item.name;document.getElementById('itemName').value=item.name||'';document.getElementById('itemDesc').value=item.description||'';document.getElementById('itemPriceTRY').value=item.price_try??'';document.getElementById('itemPriceSYP').value=item.price_syp??'';document.getElementById('itemCategory').value=item.category||'';document.getElementById('itemCategoryIcon').value=item.category_icon||'';document.getElementById('itemImage').value=item.image_url||'';const prev=document.getElementById('itemImagePreview');if(item.image_url){prev.src=toPublicUrl(item.image_url);prev.classList.remove('hidden')}else prev.classList.add('hidden');document.getElementById('deleteItem').classList.remove('hidden')}else{document.getElementById('editItemTitle').textContent='إضافة صنف';document.getElementById('itemName').value='';document.getElementById('itemDesc').value='';document.getElementById('itemPriceTRY').value='';document.getElementById('itemPriceSYP').value='';document.getElementById('itemCategory').value=defCat||activeCategory||'';document.getElementById('itemCategoryIcon').value=defIcon||'🍽️';document.getElementById('itemImage').value='';document.getElementById('itemImagePreview').classList.add('hidden');document.getElementById('deleteItem').classList.add('hidden')}modal.classList.remove('hidden')}
    document.getElementById('closeEditItem').onclick=()=>document.getElementById('editItemModal').classList.add('hidden');
    document.getElementById('saveItem').onclick=async()=>{const name=document.getElementById('itemName').value.trim();const description=document.getElementById('itemDesc').value.trim();const price_try=parseFloat(document.getElementById('itemPriceTRY').value)||0;const price_syp=parseFloat(document.getElementById('itemPriceSYP').value)||0;const category=document.getElementById('itemCategory').value.trim()||'عام';const category_icon=document.getElementById('itemCategoryIcon').value.trim()||'🍽️';const image_url=toPublicUrl(document.getElementById('itemImage').value.trim());if(!name){alert('أدخل اسم الصنف');return}const payload={name,description,price_try,price_syp,category,category_icon,image_url};let error;if(currentEditId)({error}=await sbClient.from('menu_items').update(payload).eq('id',currentEditId));else({error}=await sbClient.from('menu_items').insert([payload]));if(error){alert('خطأ: '+error.message);return}showToast('تم الحفظ ✓');document.getElementById('editItemModal').classList.add('hidden');await loadItems()};
    document.getElementById('deleteItem').onclick=async()=>{if(!currentEditId||!confirm('حذف الصنف؟'))return;const {error}=await sbClient.from('menu_items').delete().eq('id',currentEditId);if(error){alert(error.message);return}showToast('تم الحذف');document.getElementById('editItemModal').classList.add('hidden');await loadItems()};
    async function upsertSetting(key,value){const {error}=await sbClient.from('site_settings').upsert({key,value,updated_at:new Date().toISOString()});return error}
    document.getElementById('saveSiteSettings').onclick=async()=>{const pairs={site_name:document.getElementById('editSiteName').value.trim()||'ركن الشوكلاتة',logo:toPublicUrl(document.getElementById('editLogo').value.trim()),favicon:toPublicUrl(document.getElementById('editFavicon').value.trim()),cover:toPublicUrl(document.getElementById('editCover').value.trim()),shop1_name:document.getElementById('editShop1Name').value.trim(),shop1_phone:document.getElementById('editShop1Phone').value.trim(),shop2_name:document.getElementById('editShop2Name').value.trim(),shop2_phone:document.getElementById('editShop2Phone').value.trim(),footer_desc:document.getElementById('editFooterDesc').value.trim(),whatsapp:document.getElementById('editWhatsapp').value.trim(),instagram:document.getElementById('editInstagram').value.trim(),facebook:document.getElementById('editFacebook').value.trim()};const np=document.getElementById('newAdminPassword').value.trim();const cp=document.getElementById('confirmAdminPassword').value.trim();if(np){if(np!==cp){alert('كلمة السر غير متطابقة');return}if(np.length<3){alert('3 أحرف على الأقل');return}pairs.admin_password=np}for(const [k,v] of Object.entries(pairs)){const err=await upsertSetting(k,v);if(err){alert('خطأ '+k+': '+err.message);return}}document.getElementById('newAdminPassword').value='';document.getElementById('confirmAdminPassword').value='';showToast('تم حفظ الإعدادات ✓');await loadSettings()};
    document.getElementById('adminModal').onclick=e=>{if(e.target.id==='adminModal')document.getElementById('adminModal').classList.add('hidden')};
    document.getElementById('editItemModal').onclick=e=>{if(e.target.id==='editItemModal')document.getElementById('editItemModal').classList.add('hidden')};
    document.getElementById('openCartBtn').onclick=()=>{document.getElementById('cartModal').classList.remove('hidden');renderCartModal();};
    document.getElementById('closeCart').onclick=()=>document.getElementById('cartModal').classList.add('hidden');
    document.getElementById('cartModal').onclick=e=>{if(e.target.id==='cartModal')document.getElementById('cartModal').classList.add('hidden')};
    document.getElementById('sendWhatsappOrder').onclick=sendWhatsappOrder;
    updateCartUI();
    loadAll();
  </script>
</body>
