utton></div></div><div class="border border-chocolate-200 rounded-xl p-4"><h3 class="font-bold text-lg mb-4">إدارة الأقسام</h3><div id="sectionsManager" class="space-y-4"></div></div><div class="flex gap-3"><button id="exportData" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-sm">تصدير</button><button id="importData" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm">استيراد</button><button id="resetData" class="flex-1 bg-red-600 text-white py-2 rounded-lg text-sm">إعادة تعيين</button></div><input type="file" id="importFile" accept=".json" class="hidden"></div></div></div>

const defaultData={siteName:'ركن الشوكلاتة',logo:'https://images.unsplash.com/photo-1606312619070-d48b4c652a52?w=120&h=120&fit=crop',favicon:'https://images.unsplash.com/photo-1606312619070-d48b4c652a52?w=64&h=64&fit=crop',primaryColor:'#846358',currency:'ل.س',shop1Name:'',shop1Phone:'',shop2Name:'',shop2Phone:'',footerDesc:'',sections:[{id:'cakes',title:'حلويات الكيك',icon:'🎂',items:[{id:'c1',name:'كيك الشوكولاتة الفاخر',desc:'طبقات غنية من الشوكولاتة البلجيكية',priceTRY:28,priceSYP:9800,image:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600&h=400&fit=crop&q=80'},{id:'c2',name:'كيك الفانيليا',desc:'ناعم بنكهة الفانيليا',priceTRY:24,priceSYP:8400,image:'https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=600&h=400&fit=crop&q=80'},{id:'c3',name:'تشيز كيك',desc:'كريمي مع توت',priceTRY:32,priceSYP:11200,image:'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=600&h=400&fit=crop&q=80'},{id:'c4',name:'كيك الفراولة',desc:'مع كريمة وفراولة',priceTRY:26,priceSYP:9100,image:'https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=600&h=400&fit=crop&q=80'}]},{id:'icecream',title:'البوظة',icon:'🍦',items:[{id:'i1',name:'فانيليا فرنسية',desc:'كريمية 100%',priceTRY:15,priceSYP:5250,image:'https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=600&h=400&fit=crop&q=80'},{id:'i2',name:'شوكولاتة داكنة',desc:'شوكولاتة 70%',priceTRY:16,priceSYP:5600,image:'https://images.unsplash.com/photo-1497034822373-0e9d1fb2cc88?w=600&h=400&fit=crop&q=80'},{id:'i3',name:'مانجو',desc:'مانجو طازج',priceTRY:18,priceSYP:6300,image:'https://images.unsplash.com/photo-1501443765858-5250585b0b5a?w=600&h=400&fit=crop&q=80'},{id:'i4',name:'فراولة',desc:'فراولة طبيعية',priceTRY:16,priceSYP:5600,image:'https://images.unsplash.com/photo-1488900128323-21503983a07e?w=600&h=400&fit=crop&q=80'}]},{id:'western',title:'حلو غربي',icon:'🧁',items:[{id:'w1',name:'تيراميسو',desc:'إيطالي أصلي',priceTRY:30,priceSYP:10500,image:'https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=600&h=400&fit=crop&q=80'},{id:'w2',name:'براوني',desc:'شوكولاتة داكنة',priceTRY:18,priceSYP:6300,image:'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=600&h=400&fit=crop&q=80'},{id:'w3',name:'دونات',desc:'طازجة يومياً',priceTRY:12,priceSYP:4200,image:'https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600&h=400&fit=crop&q=80'},{id:'w4',name:'تشيز كيك توت',desc:'مع توت أزرق',priceTRY:27,priceSYP:9450,image:'https://images.unsplash.com/photo-1524351199678-941a58a3df50?w=600&h=400&fit=crop&q=80'}]},{id:'eastern',title:'حلو شرقي',icon:'🥮',items:[{id:'e1',name:'بقلاوة فستق',desc:'فستق حلبي',priceTRY:22,priceSYP:7700,image:'https://images.unsplash.com/photo-1519677100203-a0e668c92439?w=600&h=400&fit=crop&q=80'},{id:'e2',name:'كنافة نابلسية',desc:'جبنة عكاوي',priceTRY:25,priceSYP:8750,image:'https://images.unsplash.com/photo-1621939514649-280e2ee25f60?w=600&h=400&fit=crop&q=80'},{id:'e3',name:'معمول تمر',desc:'تمر فاخر',priceTRY:14,priceSYP:4900,image:'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=600&h=400&fit=crop&q=80'},{id:'e4',name:'قطايف',desc:'جوز أو قشطة',priceTRY:16,priceSYP:5600,image:'https://images.unsplash.com/photo-1551024506-0bccd828d307?w=600&h=400&fit=crop&q=80'}]},{id:'coldcoffee',title:'قهوات باردة',icon:'🧊',items:[{id:'cc1',name:'آيس لاتيه',desc:'إسبريسو مع حليب بارد',priceTRY:18,priceSYP:6300,image:'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=600&h=400&fit=crop&q=80'},{id:'cc2',name:'كولد برو',desc:'تخمير 18 ساعة',priceTRY:20,priceSYP:7000,image:'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=600&h=400&fit=crop&q=80'},{id:'cc3',name:'فرابتشينو',desc:'شوكولاتة مثلج',priceTRY:22,priceSYP:7700,image:'https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=600&h=400&fit=crop&q=80'},{id:'cc4',name:'آيس أمريكانو',desc:'إسبريسو وثلج',priceTRY:14,priceSYP:4900,image:'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600&h=400&fit=crop&q=80'}]},{id:'hotcoffee',title:'قهوات ساخنة',icon:'☕',items:[{id:'hc1',name:'إسبريسو',desc:'أرابيكا',priceTRY:12,priceSYP:4200,image:'https://images.unsplash.com/photo-1510591509099-dee694411b31?w=600&h=400&fit=crop&q=80'},{id:'hc2',name:'كابتشينو',desc:'رغوة حليب',priceTRY:16,priceSYP:5600,image:'https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=600&h=400&fit=crop&q=80'},{id:'hc3',name:'لاتيه',desc:'حليب مخملي',priceTRY:17,priceSYP:5950,image:'https://images.unsplash.com/photo-1561882468-9110e03e0f78?w=600&h=400&fit=crop&q=80'},{id:'hc4',name:'موكا',desc:'شوكولاتة وإسبريسو',priceTRY:19,priceSYP:6650,image:'https://images.unsplash.com/photo-1578374173704-2872b2b0b0b0?w=600&h=400&fit=crop&q=80'}]},{id:'drinks',title:'مشروبات وعصائر',icon:'🧃',items:[{id:'d1',name:'عصير برتقال',desc:'طازج 100%',priceTRY:14,priceSYP:4900,image:'https://images.unsplash.com/photo-1622597467836-f3285f2131b8?w=600&h=400&fit=crop&q=80'},{id:'d2',name:'ليموناضة',desc:'ليمون ونعناع',priceTRY:12,priceSYP:4200,image:'https://images.unsplash.com/photo-1523677011780-c13bec071f9b?w=600&h=400&fit=crop&q=80'},{id:'d3',name:'سموذي فراولة',desc:'فراولة وموز',priceTRY:18,priceSYP:6300,image:'https://images.unsplash.com/photo-1505252585461-04db1eb84625?w=600&h=400&fit=crop&q=80'},{id:'d4',name:'شاي مثلج',desc:'بنكهة الخوخ',priceTRY:13,priceSYP:4550,image:'https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=600&h=400&fit=crop&q=80'}]}]};
let data=JSON.parse(localStorage.getItem('ruknData'))||structuredClone(defaultData);
let currentEdit={sectionId:null,itemId:null};
let activeSectionId=data.sections.length?data.sections[0].id:null;
let isAdminUnlocked=sessionStorage.getItem('ruknAdminUnlocked')==='yes';
function saveData(){localStorage.setItem('ruknData',JSON.stringify(data));showToast('تم الحفظ بنجاح ✓')}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('opacity-0');t.classList.add('opacity-100');setTimeout(()=>{t.classList.add('opacity-0');t.classList.remove('opacity-100')},2500)}
function applySiteSettings(){
document.getElementById('siteName').textContent=data.siteName;
document.getElementById('footerName').textContent=data.siteName;
document.title=data.siteName;
document.getElementById('siteLogo').src=data.logo;
const fav=data.favicon||data.logo||'';const fl=document.getElementById('siteFavicon');if(fl&&fav)fl.href=fav;
const fd=document.getElementById('footerDesc');if(fd){if(data.footerDesc){fd.textContent=data.footerDesc;fd.classList.remove('hidden')}else{fd.textContent='';fd.classList.add('hidden')}}
const s1b=document.getElementById('shop1Box'),s1n=document.getElementById('shop1NameEl'),s1p=document.getElementById('shop1PhoneEl');
if(s1b&&(data.shop1Name||data.shop1Phone)){s1b.classList.remove('hidden');if(s1n)s1n.textContent=data.shop1Name||'';if(s1p){const ph=(data.shop1Phone||'').trim();s1p.textContent=ph;s1p.href=ph?('tel:'+ph.replace(/\s/g,'')):'#'}}else if(s1b)s1b.classList.add('hidden');
const s2b=document.getElementById('shop2Box'),s2n=document.getElementById('shop2NameEl'),s2p=document.getElementById('shop2PhoneEl');
if(s2b&&(data.shop2Name||data.shop2Phone)){s2b.classList.remove('hidden');if(s2n)s2n.textContent=data.shop2Name||'';if(s2p){const ph=(data.shop2Phone||'').trim();s2p.textContent=ph;s2p.href=ph?('tel:'+ph.replace(/\s/g,'')):'#'}}else if(s2b)s2b.classList.add('hidden');
}
function renderCategoryBar(){const bar=document.getElementById('categoryBar');bar.innerHTML='';data.sections.forEach(s=>{const b=document.createElement('button');b.className='cat-btn px-4 py-2 rounded-full text-sm font-semibold border border-chocolate-200 '+(s.id===activeSectionId?'active':'bg-white text-chocolate-800');b.innerHTML=s.icon+' '+s.title;b.onclick=()=>{activeSectionId=s.id;renderCategoryBar();renderActiveSection()};bar.appendChild(b)})}
function renderActiveSection(){const c=document.getElementById('menuContainer');c.innerHTML='';const section=data.sections.find(s=>s.id===activeSectionId);if(!section){c.innerHTML='<p class="text-center text-chocolate-500 py-20">لا توجد أقسام</p>';return}
const w=document.createElement('div');w.className='fade-in';w.innerHTML='<div class="flex items-center gap-3 mb-6"><span class="text-3xl">'+section.icon+'</span><h2 class="text-2xl md:text-3xl font-bold">'+section.title+'</h2></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" id="itemsGrid"></div>';c.appendChild(w);
const grid=document.getElementById('itemsGrid');
section.items.forEach(item=>{const card=document.createElement('div');card.className='bg-white rounded-2xl overflow-hidden shadow-md card-hover border border-chocolate-100';
card.innerHTML='<div class="relative h-48 overflow-hidden"><img src="'+item.image+'" alt="" class="w-full h-full object-cover" loading="lazy"><div class="absolute top-3 left-3 bg-chocolate-800/90 text-white text-xs font-bold px-2.5 py-1.5 rounded-full">'+(item.priceTRY||0)+' ₺ | '+(item.priceSYP||0)+' ل.س</div></div><div class="p-4"><h3 class="font-bold text-lg mb-1">'+item.name+'</h3><p class="text-sm text-chocolate-600 line-clamp-2">'+item.desc+'</p>'+(isAdminUnlocked?'<button class="edit-btn mt-3 w-full bg-chocolate-100 py-2 rounded-lg text-sm" data-section="'+section.id+'" data-item="'+item.id+'">✏️ تعديل</button>':'')+'</div>';
grid.appendChild(card)});
if(isAdminUnlocked){const ab=document.createElement('div');ab.className='bg-chocolate-50 border-2 border-dashed border-chocolate-300 rounded-2xl flex flex-col items-center justify-center min-h-[280px] cursor-pointer';ab.innerHTML='<span class="text-4xl mb-2">➕</span><span class="font-semibold">إضافة صنف</span>';ab.onclick=()=>openEditItem(section.id,null);grid.appendChild(ab);document.querySelectorAll('.edit-btn').forEach(b=>b.onclick=()=>openEditItem(b.dataset.section,b.dataset.item))}}
let logoC=0,logoT=null;document.getElementById('siteLogo').style.cursor='pointer';
document.getElementById('siteLogo').onclick=()=>{logoC++;clearTimeout(logoT);logoT=setTimeout(()=>logoC=0,2500);if(logoC>=5){logoC=0;if(!isAdminUnlocked){const e=prompt('أدخل كلمة سر لوحة التحكم:');if(e===null)return;if(e!==getAdminPassword()){alert('كلمة السر غير صحيحة');return}sessionStorage.setItem('ruknAdminUnlocked','yes');isAdminUnlocked=true;renderActiveSection()}openAdminPanel()}};
function openAdminPanel(){document.getElementById('adminModal').classList.remove('hidden');
document.getElementById('editSiteName').value=data.siteName;
document.getElementById('editLogo').value=data.logo;
document.getElementById('editFavicon').value=data.favicon||data.logo||'';
const p=document.getElementById('faviconPreview');if(p){p.src=data.favicon||data.logo||'';p.style.display='inline-block'}
;['editShop1Name','editShop1Phone','editShop2Name','editShop2Phone','editFooterDesc'].forEach((id,i)=>{const el=document.getElementById(id);if(el)el.value=[data.shop1Name,data.shop1Phone,data.shop2Name,data.shop2Phone,data.footerDesc][i]||''});
renderSectionsManager()}
document.getElementById('closeAdmin').onclick=()=>document.getElementById('adminModal').classList.add('hidden');
function renderSectionsManager(){const c=document.getElementById('sectionsManager');c.innerHTML='';data.sections.forEach(s=>{const d=document.createElement('div');d.className='bg-chocolate-50 rounded-xl p-3';d.innerHTML='<div class="flex justify-between mb-2"><h4 class="font-bold text-sm">'+s.icon+' '+s.title+'</h4><button onclick="deleteSection(\''+s.id+'\')" class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded">🗑️</button></div><div class="flex flex-wrap gap-1.5">'+s.items.map(i=>'<button class="text-xs bg-white border px-2 py-1 rounded-lg" onclick="openEditItem(\''+s.id+'\',\''+i.id+'\')">'+i.name+'</button>').join('')+'<button class="text-xs bg-chocolate-200 px-2 py-1 rounded-lg" onclick="openEditItem(\''+s.id+'\',null)">+ إضافة</button></div>';c.appendChild(d)})}
window.deleteSection=function(id){if(!confirm('حذف القسم؟'))return;data.sections=data.sections.filter(s=>s.id!==id);if(activeSectionId===id)activeSectionId=data.sections[0]?.id||null;saveData();renderCategoryBar();renderActiveSection();renderSectionsManager()};
document.getElementById('addNewSection').onclick=()=>{const t=document.getElementById('newSectionTitle').value.trim();const ic=document.getElementById('newSectionIcon').value.trim()||'🍽️';if(!t){alert('اكتب اسم القسم');return}const id='sec_'+Date.now();data.sections.push({id,title:t,icon:ic,items:[]});document.getElementById('newSectionTitle').value='';document.getElementById('newSectionIcon').value='';activeSectionId=id;saveData();renderCategoryBar();renderActiveSection();renderSectionsManager();showToast('تم إضافة القسم')};
window.openEditItem=function(sid,iid){currentEdit={sectionId:sid,itemId:iid};const modal=document.getElementById('editItemModal');const sec=data.sections.find(s=>s.id===sid);
if(iid){const item=sec.items.find(i=>i.id===iid);document.getElementById('editItemTitle').textContent='تعديل: '+item.name;document.getElementById('itemName').value=item.name;document.getElementById('itemDesc').value=item.desc;document.getElementById('itemPriceTRY').value=item.priceTRY||'';document.getElementById('itemPriceSYP').value=item.priceSYP||'';document.getElementById('itemImage').value=item.image;document.getElementById('itemImagePreview').src=item.image;document.getElementById('itemImagePreview').classList.remove('hidden');document.getElementById('deleteItem').classList.remove('hidden')}
else{document.getElementById('editItemTitle').textContent='إضافة - '+sec.title;document.getElementById('itemName').value='';document.getElementById('itemDesc').value='';document.getElementById('itemPriceTRY').value='';document.getElementById('itemPriceSYP').value='';document.getElementById('itemImage').value='';document.getElementById('itemImagePreview').classList.add('hidden');document.getElementById('deleteItem').classList.add('hidden')}
modal.classList.remove('hidden')};
document.getElementById('closeEditItem').onclick=()=>document.getElementById('editItemModal').classList.add('hidden');
document.getElementById('saveItem').onclick=()=>{const name=document.getElementById('itemName').value.trim();const desc=document.getElementById('itemDesc').value.trim();const priceTRY=parseFloat(document.getElementById('itemPriceTRY').value)||0;const priceSYP=parseFloat(document.getElementById('itemPriceSYP').value)||0;const image=document.getElementById('itemImage').value.trim();if(!name){alert('أدخل الاسم');return}const sec=data.sections.find(s=>s.id===currentEdit.sectionId);
if(currentEdit.itemId){const item=sec.items.find(i=>i.id===currentEdit.itemId);item.name=name;item.desc=desc;item.priceTRY=priceTRY;item.priceSYP=priceSYP;item.image=image||item.image}
else{sec.items.push({id:'item_'+Date.now(),name,desc,priceTRY,priceSYP,image:image||'https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600&h=400&fit=crop'})}
saveData();renderActiveSection();renderSectionsManager();document.getElementById('editItemModal').classList.add('hidden')};
document.getElementById('deleteItem').onclick=()=>{if(!confirm('حذف؟'))return;const sec=data.sections.find(s=>s.id===currentEdit.sectionId);sec.items=sec.items.filter(i=>i.id!==currentEdit.itemId);saveData();renderActiveSection();renderSectionsManager();document.getElementById('editItemModal').classList.add('hidden')};
document.getElementById('itemImage').oninput=e=>{const p=document.getElementById('itemImagePreview');if(e.target.value){p.src=e.target.value;p.classList.remove('hidden')}else p.classList.add('hidden')};
document.getElementById('itemImageUpload').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1.5*1024*1024){alert('الصورة كبيرة');return}const r=new FileReader();r.onload=ev=>{document.getElementById('itemImage').value=ev.target.result;const p=document.getElementById('itemImagePreview');p.src=ev.target.result;p.classList.remove('hidden');showToast('تم رفع الصورة')};r.readAsDataURL(f)};
document.getElementById('saveSiteSettings').onclick=()=>{data.siteName=document.getElementById('editSiteName').value.trim()||data.siteName;data.logo=document.getElementById('editLogo').value.trim()||data.logo;data.favicon=document.getElementById('editFavicon').value.trim()||data.favicon||data.logo;data.shop1Name=document.getElementById('editShop1Name').value.trim()||'';data.shop1Phone=document.getElementById('editShop1Phone').value.trim()||'';data.shop2Name=document.getElementById('editShop2Name').value.trim()||'';data.shop2Phone=document.getElementById('editShop2Phone').value.trim()||'';data.footerDesc=document.getElementById('editFooterDesc').value.trim()||'';const np=document.getElementById('newAdminPassword').value.trim();const cp=document.getElementById('confirmAdminPassword').value.trim();if(np){if(np!==cp){alert('كلمة السر غير متطابقة');return}if(np.length<3){alert('3 أحرف على الأقل');return}setAdminPassword(np);document.getElementById('newAdminPassword').value='';document.getElementById('confirmAdminPassword').value='';showToast('تم تغيير كلمة السر')}applySiteSettings();saveData();renderActiveSection()};
document.getElementById('logoUpload').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{document.getElementById('editLogo').value=ev.target.result;showToast('تم رفع الشعار')};r.readAsDataURL(f)};
document.getElementById('faviconUpload').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{document.getElementById('editFavicon').value=ev.target.result;const p=document.getElementById('faviconPreview');p.src=ev.target.result;p.style.display='inline-block';showToast('تم رفع الأيقونة')};r.readAsDataURL(f)};
document.getElementById('exportData').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='rukn-data.json';a.click();URL.revokeObjectURL(u)};
document.getElementById('importData').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{data=JSON.parse(ev.target.result);saveData();applySiteSettings();activeSectionId=data.sections[0]?.id||null;renderCategoryBar();renderActiveSection();renderSectionsManager();showToast('تم الاستيراد')}catch{alert('ملف غير صالح')}};r.readAsText(f)};
document.getElementById('resetData').onclick=()=>{if(!confirm('إعادة تعيين؟'))return;data=structuredClone(defaultData);localStorage.removeItem('ruknData');activeSectionId=data.sections[0].id;applySiteSettings();renderCategoryBar();renderActiveSection();renderSectionsManager();showToast('تم')};
document.getElementById('adminModal').onclick=e=>{if(e.target.id==='adminModal')document.getElementById('adminModal').classList.add('hidden')};
document.getElementById('editItemModal').onclick=e=>{if(e.target.id==='editItemModal')document.getElementById('editItemModal').classList.add('hidden')};
applySiteSettings();renderCategoryBar();renderActiveSection();
</script>
</body>
</html>
