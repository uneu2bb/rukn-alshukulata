<script>tailwind.config={theme:{extend:{colors:{chocolate:{50:'#fdf8f6',100:'#f2e8e5',200:'#eaddd7',300:'#e0cec7',400:'#d2bab0',500:'#bfa094',600:'#a18072',700:'#977669',800:'#846358',900:'#43302b',950:'#2c1810'}},fontFamily:{cairo:['Cairo','sans-serif']}}}}</script>
<style>
body{font-family:'Cairo',sans-serif}
.card-hover{transition:all .3s ease}.card-hover:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(67,48,43,.15)}
.admin-panel{max-height:90vh;overflow-y:auto}
.fade-in{animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
input,textarea,select{direction:rtl}
.cat-btn{transition:all .25s ease;white-space:nowrap}.cat-btn.active{background:#846358;color:#fff;box-shadow:0 4px 12px rgba(132,99,88,.35)}.cat-btn:not(.active):hover{background:#f2e8e5}
.scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
img.fade-img{opacity:0;transition:opacity .45s ease}img.fade-img.is-loaded{opacity:1}
#floatingCart{transform:translateY(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}#floatingCart.show{transform:translateY(0)}
.qty-btn{width:2rem;height:2rem;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;line-height:1}.qty-btn:active{transform:scale(.92)}
.search-wrap{position:relative}
.search-wrap input:focus{outline:none;box-shadow:0 0 0 3px rgba(132,99,88,.2);border-color:#846358}
.search-icon{pointer-events:none}
.item-card-anim{animation:itemIn .28s ease both}
@keyframes itemIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.search-clear{cursor:pointer}
.card-dragging{opacity:.45;transform:scale(.98)}
.card-drag-over{outline:2px dashed #846358;outline-offset:4px}
.drag-handle{cursor:grab;user-select:none}
.drag-handle:active{cursor:grabbing}
.shop-closed-banner{background:linear-gradient(90deg,#b91c1c,#dc2626,#b91c1c);background-size:200% 100%;animation:bannerMove 3s linear infinite;color:#fff;text-align:center;padding:.65rem 1rem;font-weight:700;font-size:.875rem}
@keyframes bannerMove{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.toggle-switch{position:relative;width:56px;height:30px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#9ca3af;border-radius:9999px;transition:.25s}
.toggle-slider:before{content:"";position:absolute;height:22px;width:22px;left:4px;bottom:4px;background:#fff;border-radius:50%;transition:.25s}
.toggle-switch input:checked+.toggle-slider{background:#16a34a}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(26px)}
</style>
</head>
