        ]}

    let data = JSON.parse(localStorage.getItem('ruknData')) || structuredClone(defaultData);
    let currentEdit = { sectionId: null, itemId: null };
    let activeSectionId = data.sections.length ? data.sections[0].id : null;
    let isAdminUnlocked = sessionStorage.getItem("ruknAdminUnlocked") === "yes";

    function saveData() { localStorage.setItem('ruknData', JSON.stringify(data)); showToast('تم الحفظ بنجاح ✓'); }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.remove('opacity-0'); t.classList.add('opacity-100');
      setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 2500);
    }
    function applySiteSettings() {
      document.getElementById('siteName').textContent = data.siteName;
      document.getElementById('footerName').textContent = data.siteName;
      document.title = data.siteName;
      document.getElementById('siteLogo').src = data.logo;
    }

    function renderCategoryBar() {
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = '';
      data.sections.forEach(section => {
        const btn = document.createElement('button');
        btn.className = `cat-btn px-4 py-2 rounded-full text-sm font-semibold border border-chocolate-200 ${section.id === activeSectionId ? 'active' : 'bg-white text-chocolate-800'}`;
        btn.innerHTML = `${section.icon} ${section.title}`;
        btn.onclick = () => { activeSectionId = section.id; renderCategoryBar(); renderActiveSection(); };
        bar.appendChild(btn);
      });
    }

    function renderActiveSection() {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';
      const section = data.sections.find(s => s.id === activeSectionId);
      if (!section) { container.innerHTML = '<p class="text-center text-chocolate-500 py-20">لا توجد أقسام</p>'; return; }
      const wrapper = document.createElement('div');
      wrapper.className = 'fade-in';
      wrapper.innerHTML = `<div class="flex items-center gap-3 mb-6"><span class="text-3xl">${section.icon}</span><h2 class="text-2xl md:text-3xl font-bold text-chocolate-900">${section.title}</h2></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" id="itemsGrid"></div>`;
      container.appendChild(wrapper);
      const grid = document.getElementById('itemsGrid');
      section.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl overflow-hidden shadow-md card-hover border border-chocolate-100';
        card.innerHTML = `<div class="relative h-48 overflow-hidden"><img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover transition duration-500 hover:scale-110" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600&h=400&fit=crop'"><div class="absolute top-3 left-3 bg-chocolate-800/90 text-white text-sm font-bold px-3 py-1 rounded-full">${item.price} ر.س</div></div><div class="p-4"><h3 class="font-bold text-lg text-chocolate-900 mb-1">${item.name}</h3><p class="text-sm text-chocolate-600 leading-relaxed line-clamp-2">${item.desc}</p>${isAdminUnlocked ? `<button class="edit-btn mt-3 w-full bg-chocolate-100 text-chocolate-800 py-2 rounded-lg text-sm font-semibold hover:bg-chocolate-200 transition" data-section="${section.id}" data-item="${item.id}">✏️ تعديل</button>` : ''}</div>`;
        grid.appendChild(card);
      });
      if (isAdminUnlocked) {
        const addBtn = document.createElement('div');
        addBtn.className = 'bg-chocolate-50 border-2 border-dashed border-chocolate-300 rounded-2xl flex flex-col items-center justify-center min-h-[280px] cursor-pointer hover:bg-chocolate-100 transition';
        addBtn.innerHTML = `<span class="text-4xl mb-2">➕</span><span class="font-semibold text-chocolate-700">إضافة صنف</span>`;
        addBtn.onclick = () => openEditItem(section.id, null);
        grid.appendChild(addBtn);
        document.querySelectorAll('.edit-btn').forEach(btn => { btn.onclick = () => openEditItem(btn.dataset.section, btn.dataset.item); });
      }
    }

    document.getElementById('menuBtn').onclick = () => document.getElementById('sideMenu').classList.remove('hidden');
    document.getElementById('closeSideMenu').onclick = closeSideMenu;
    document.getElementById('sideMenuOverlay').onclick = closeSideMenu;
    function closeSideMenu() { document.getElementById('sideMenu').classList.add('hidden'); }

    document.getElementById('adminAccessBtn').onclick = () => {
      closeSideMenu();
      if (!isAdminUnlocked) {
        const entered = prompt("أدخل كلمة سر لوحة التحكم:");
        if (entered === null) return;
        if (entered !== ADMIN_PASSWORD) { alert("كلمة السر غير صحيحة"); return; }
        sessionStorage.setItem("ruknAdminUnlocked", "yes");
        isAdminUnlocked = true;
        renderActiveSection();
      }
      openAdminPanel();
    };

    function openAdminPanel() {
      document.getElementById('adminModal').classList.remove('hidden');
      document.getElementById('editSiteName').value = data.siteName;
      document.getElementById('editLogo').value = data.logo;
      renderSectionsManager();
    }
    document.getElementById('closeAdmin').onclick = () => document.getElementById('adminModal').classList.add('hidden');

    function renderSectionsManager() {
      const container = document.getElementById('sectionsManager');
      container.innerHTML = '';
      data.sections.forEach(section => {
        const div = document.createElement('div');
        div.className = 'bg-chocolate-50 rounded-xl p-3';
        div.innerHTML = `<div class="flex justify-between items-center mb-2"><h4 class="font-bold text-sm">${section.icon} ${section.title}</h4><div class="flex items-center gap-2"><span class="text-xs text-chocolate-600">${section.items.length} أصناف</span><button onclick="deleteSection('${section.id}')" class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded hover:bg-red-200">🗑️</button></div></div><div class="flex flex-wrap gap-1.5">${section.items.map(item => `<button class="text-xs bg-white border border-chocolate-200 px-2 py-1 rounded-lg hover:bg-chocolate-100" onclick="openEditItem('${section.id}', '${item.id}')">${item.name}</button>`).join('')}<button class="text-xs bg-chocolate-200 text-chocolate-800 px-2 py-1 rounded-lg hover:bg-chocolate-300" onclick="openEditItem('${section.id}', null)">+ إضافة</button></div>`;
        container.appendChild(div);
      });
    }

    window.deleteSection = function(sectionId) {
      if (!confirm('هل أنت متأكد من حذف هذا القسم بالكامل؟')) return;
      data.sections = data.sections.filter(s => s.id !== sectionId);
      if (activeSectionId === sectionId) activeSectionId = data.sections.length ? data.sections[0].id : null;
      saveData(); renderCategoryBar(); renderActiveSection(); renderSectionsManager();
    };

    document.getElementById('addNewSection').onclick = () => {
      const title = document.getElementById('newSectionTitle').value.trim();
      const icon = document.getElementById('newSectionIcon').value.trim() || '🍽️';
      if (!title) { alert('الرجاء كتابة اسم القسم'); return; }
      const id = 'sec_' + Date.now();
      data.sections.push({ id, title, icon, items: [] });
      document.getElementById('newSectionTitle').value = '';
      document.getElementById('newSectionIcon').value = '';
      activeSectionId = id;
      saveData(); renderCategoryBar(); renderActiveSection(); renderSectionsManager();
      showToast('تم إضافة القسم ✓');
    };

    window.openEditItem = function(sectionId, itemId) {
      currentEdit = { sectionId, itemId };
      const modal = document.getElementById('editItemModal');
      const section = data.sections.find(s => s.id === sectionId);
      if (itemId) {
        const item = section.items.find(i => i.id === itemId);
        document.getElementById('editItemTitle').textContent = 'تعديل: ' + item.name;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemDesc').value = item.desc;
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemImage').value = item.image;
        document.getElementById('itemImagePreview').src = item.image;
        document.getElementById('itemImagePreview').classList.remove('hidden');
        document.getElementById('deleteItem').classList.remove('hidden');
      } else {
        document.getElementById('editItemTitle').textContent = 'إضافة صنف - ' + section.title;
        document.getElementById('itemName').value = '';
        document.getElementById('itemDesc').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemImage').value = '';
        document.getElementById('itemImagePreview').classList.add('hidden');
        document.getElementById('deleteItem').classList.add('hidden');
      }
      modal.classList.remove('hidden');
    };
    document.getElementById('closeEditItem').onclick = () => document.getElementById('editItemModal').classList.add('hidden');

    document.getElementById('saveItem').onclick = () => {
      const name = document.getElementById('itemName').value.trim();
      const desc = document.getElementById('itemDesc').value.trim();
      const price = parseFloat(document.getElementById('itemPrice').value) || 0;
      const image = document.getElementById('itemImage').value.trim();
      if (!name) { alert('الرجاء إدخال اسم الصنف'); return; }
      const section = data.sections.find(s => s.id === currentEdit.sectionId);
      if (currentEdit.itemId) {
        const item = section.items.find(i => i.id === currentEdit.itemId);
        item.name = name; item.desc = desc; item.price = price; item.image = image || item.image;
      } else {
        section.items.push({ id: 'item_' + Date.now(), name, desc, price, image: image || 'https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600&h=400&fit=crop' });
      }
      saveData(); renderActiveSection(); renderSectionsManager();
      document.getElementById('editItemModal').classList.add('hidden');
    };
    document.getElementById('deleteItem').onclick = () => {
      if (!confirm('هل أنت متأكد من حذف هذا الصنف؟')) return;
      const section = data.sections.find(s => s.id === currentEdit.sectionId);
      section.items = section.items.filter(i => i.id !== currentEdit.itemId);
      saveData(); renderActiveSection(); renderSectionsManager();
      document.getElementById('editItemModal').classList.add('hidden');
    };

    document.getElementById('itemImage').oninput = (e) => {
      const prev = document.getElementById('itemImagePreview');
      if (e.target.value) { prev.src = e.target.value; prev.classList.remove('hidden'); } else prev.classList.add('hidden');
    };
    document.getElementById('itemImageUpload').onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      if (file.size > 1.5*1024*1024) { alert('الصورة كبيرة (الحد 1.5 ميجا)'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('itemImage').value = ev.target.result;
        const prev = document.getElementById('itemImagePreview');
        prev.src = ev.target.result; prev.classList.remove('hidden');
        showToast('تم رفع الصورة ✓');
      };
      reader.readAsDataURL(file);
    };

    document.getElementById('saveSiteSettings').onclick = () => {
      data.siteName = document.getElementById('editSiteName').value.trim() || data.siteName;
      data.logo = document.getElementById('editLogo').value.trim() || data.logo;
      applySiteSettings(); saveData();
    };
    document.getElementById('logoUpload').onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      if (file.size > 2*1024*1024) { alert('الصورة كبيرة (الحد 2 ميجا)'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => { document.getElementById('editLogo').value = ev.target.result; showToast('تم رفع الشعار ✓ اضغط حفظ'); };
      reader.readAsDataURL(file);
    };

    document.getElementById('exportData').onclick = () => {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = 'rukn-data.json'; a.click(); URL.revokeObjectURL(url); showToast('تم التصدير');
    };
    document.getElementById('importData').onclick = () => document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          data = JSON.parse(ev.target.result); saveData(); applySiteSettings();
          activeSectionId = data.sections[0]?.id || null;
          renderCategoryBar(); renderActiveSection(); renderSectionsManager(); showToast('تم الاستيراد');
        } catch { alert('ملف غير صالح'); }
      };
      reader.readAsText(file);
    };
    document.getElementById('resetData').onclick = () => {
      if (!confirm('سيتم حذف كل التعديلات. متأكد؟')) return;
      data = structuredClone(defaultData); localStorage.removeItem('ruknData');
      activeSectionId = data.sections[0].id; applySiteSettings();
      renderCategoryBar(); renderActiveSection(); renderSectionsManager(); showToast('تم إعادة التعيين');
    };

    document.getElementById('adminModal').onclick = (e) => { if (e.target.id === 'adminModal') document.getElementById('adminModal').classList.add('hidden'); };
    document.getElementById('editItemModal').onclick = (e) => { if (e.target.id === 'editItemModal') document.getElementById('editItemModal').classList.add('hidden'); };

    applySiteSettings();
    renderCategoryBar();
    renderActiveSection();
  </script>
</body>
</html>
