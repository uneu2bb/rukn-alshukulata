  <script>
    const SUPABASE_URL = 'https://pfslgeehnliczddigdtw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_X6qLBG-YzlQExyDq6Wix_Q_rzc5g77b';
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const STORAGE_BUCKET = 'menu-images';
    let settings = {}, items = [], sections = [], activeCategory = null, currentEditId = null;
    let isAdminUnlocked = sessionStorage.getItem('ruknAdminUnlocked') === 'yes';
    function cacheBust(url){if(!url)return url;var sep=url.indexOf('?')>=0?'&':'?';return url+sep+'t='+Date.now()}
    function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('opacity-0');t.classList.add('opacity-100');setTimeout(()=>{t.classList.add('opacity-0');t.classList.remove('opacity-100')},2500)}
    function groupIntoSections(list){const map={};list.forEach(item=>{const cat=item.category||'عام';if(!map[cat])map[cat]={title:cat,icon:item.category_icon||'🍽️',items:[]};map[cat].items.push(item);if(item.category_icon)map[cat].icon=item.category_icon});return Object.values(map)}
    async function loadSettings(){const {data,error}=await sbClient.from('site_settings').select('key,value');if(error){console.error(error);return}settings={};(data||[]).forEach(r=>settings[r.key]=r.value);applySettings()}
    async function loadItems(){const {data,error}=await sbClient.from('menu_items').select('*').order('sort_order',{ascending:true});if(error){document.getElementById('menuContainer').innerHTML='<div class="text-center py-20 text-red-600">خطأ: '+error.message+'</div>';return}items=data||[];sections=groupIntoSections(items);if(!activeCategory&&sections.length)activeCategory=sections[0].title;if(activeCategory&&!sections.find(s=>s.title===activeCategory))activeCategory=sections.length?sections[0].title:null;renderCategoryBar();renderActiveSection();if(isAdminUnlocked)renderSectionsManager()}
    async function loadAll(){await loadSettings();await loadItems()}
    function applySettings(){
      const name=settings.site_name||'ركن الشوكلاتة';
      document.getElementById('siteName').textContent=name;document.getElementById('footerName').textContent=name;document.title=name;
      if(settings.logo)document.getElementById('siteLogo').src=cacheBust(settings.logo);
      const fav=settings.favicon||settings.logo||'';const fl=document.getElementById('siteFavicon');if(fl&&fav)fl.href=cacheBust(fav);
      const hero=document.getElementById('heroCover');if(hero&&settings.cover)hero.src=cacheBust(settings.cover);
      const fd=document.getElementById('footerDesc');if(settings.footer_desc){fd.textContent=settings.footer_desc;fd.classList.remove('hidden')}else{fd.textContent='';fd.classList.add('hidden')}
      const s1b=document.getElementById('shop1Box');if(settings.shop1_name||settings.shop1_phone){s1b.classList.remove('hidden');document.getElementById('shop1NameEl').textContent=settings.shop1_name||'';const ph=(settings.shop1_phone||'').trim();const a=document.getElementById('shop1PhoneEl');a.textContent=ph;a.href=ph?('tel:'+ph.replace(/\s/g,'')):'#'}else s1b.classList.add('hidden');
      const s2b=document.getElementById('shop2Box');if(settings.shop2_name||settings.shop2_phone){s2b.classList.remove('hidden');document.getElementById('shop2NameEl').textContent=settings.shop2_name||'';const ph=(settings.shop2_phone||'').trim();const a=document.getElementById('shop2PhoneEl');a.textContent=ph;a.href=ph?('tel:'+ph.replace(/\s/g,'')):'#'}else s2b.classList.add('hidden');
      function normWa(v){v=(v||'').trim();if(!v)return'';if(/^https?:\/\//i.test(v)||v.includes('wa.me'))return v.startsWith('http')?v:('https://'+v);const d=v.replace(/[^0-9]/g,'');return d?('https://wa.me/'+d):''}
      function normIg(v){v=(v||'').trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;return 'https://instagram.com/'+v.replace(/^@/,'')}
      function normFb(v){v=(v||'').trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;return 'https://facebook.com/'+v.replace(/^@/,'')}
      const wa=document.getElementById('socialWhatsapp'),ig=document.getElementById('socialInstagram'),fb=document.getElementById('socialFacebook');
      const waU=normWa(settings.whatsapp),igU=normIg(settings.instagram),fbU=normFb(settings.facebook);
      if(waU){wa.href=waU;wa.classList.remove('hidden')}else wa.classList.add('hidden');
      if(igU){ig.href=igU;ig.classList.remove('hidden')}else ig.classList.add('hidden');
      if(fbU){fb.href=fbU;fb.classList.remove('hidden')}else fb.classList.add('hidden');
    }
    function renderCategoryBar(){const bar=document.getElementById('categoryBar');bar.innerHTML='';sections.forEach(sec=>{const btn=document.createElement('button');btn.className='cat-btn px-4 py-2 rounded-full text-sm font-semibold border border-chocolate-200 '+(sec.title===activeCategory?'active':'bg-white text-chocolate-800');btn.innerHTML=sec.icon+' '+sec.title;btn.onclick=()=>{activeCategory=sec.title;renderCategoryBar();renderActiveSection()};bar.appendChild(btn)})}
    function renderActiveSection(){const container=document.getElementById('menuContainer');container.innerHTML='';const section=sections.find(s=>s.title===activeCategory);if(!section){container.innerHTML='<p class="text-center text-chocolate-500 py-20">لا توجد أصناف</p>';return}const wrapper=document.createElement('div');wrapper.className='fade-in';wrapper.innerHTML='<div class="flex items-center gap-3 mb-6"><span class="text-3xl">'+section.icon+'</span><h2 class="text-2xl font-bold">'+section.title+'</h2></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" id="itemsGrid"></div>';container.appendChild(wrapper);const grid=document.getElementById('itemsGrid');section.items.forEach(item=>{const card=document.createElement('div');card.className='bg-white rounded-2xl overflow-hidden shadow-md card-hover border border-chocolate-100';const img=cacheBust(item.image_url||'https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600&h=400&fit=crop');card.innerHTML='<div class="relative h-48 overflow-hidden"><img src="'+img+'" class="w-full h-full object-cover" loading="lazy" alt=""><div class="absolute top-3 left-3 bg-chocolate-800/90 text-white text-xs font-bold px-2.5 py-1.5 rounded-full">'+(item.price_try||0)+' ₺ | '+(item.price_syp||0)+' ل.س</div></div><div class="p-4"><h3 class="font-bold text-lg mb-1">'+(item.name||'')+'</h3><p class="text-sm text-chocolate-600 line-clamp-2">'+(item.description||'')+'</p>'+(isAdminUnlocked?'<button class="edit-btn mt-3 w-full bg-chocolate-100 py-2 rounded-lg text-sm" data-id="'+item.id+'">✏️ تعديل</button>':'')+'</div>';grid.appendChild(card)});if(isAdminUnlocked){const addBtn=document.createElement('div');addBtn.className='bg-chocolate-50 border-2 border-dashed border-chocolate-300 rounded-2xl flex flex-col items-center justify-center min-h-[280px] cursor-pointer';addBtn.innerHTML='<span class="text-4xl mb-2">➕</span><span class="font-semibold">إضافة صنف</span>';addBtn.onclick=()=>openEditItem(null,activeCategory);grid.appendChild(addBtn);document.querySelectorAll('.edit-btn').forEach(btn=>{btn.onclick=()=>openEditItem(btn.dataset.id)})}}
    let logoClickCount=0,logoClickTimer=null;document.getElementById('siteLogo').style.cursor='pointer';document.getElementById('siteLogo').onclick=()=>{logoClickCount++;clearTimeout(logoClickTimer);logoClickTimer=setTimeout(()=>{logoClickCount=0},2500);if(logoClickCount>=5){logoClickCount=0;if(!isAdminUnlocked){const entered=prompt('أدخل كلمة سر لوحة التحكم:');if(entered===null)return;if(entered!==(settings.admin_password||'2004')){alert('كلمة السر غير صحيحة');return}sessionStorage.setItem('ruknAdminUnlocked','yes');isAdminUnlocked=true;renderActiveSection()}openAdminPanel()}};
    function openAdminPanel(){document.getElementById('adminModal').classList.remove('hidden');document.getElementById('editSiteName').value=settings.site_name||'';document.getElementById('editLogo').value=settings.logo||'';document.getElementById('editFavicon').value=settings.favicon||'';document.getElementById('editCover').value=settings.cover||'';document.getElementById('editShop1Name').value=settings.shop1_name||'';document.getElementById('editShop1Phone').value=settings.shop1_phone||'';document.getElementById('editShop2Name').value=settings.shop2_name||'';document.getElementById('editShop2Phone').value=settings.shop2_phone||'';document.getElementById('editFooterDesc').value=settings.footer_desc||'';document.getElementById('editWhatsapp').value=settings.whatsapp||'';document.getElementById('editInstagram').value=settings.instagram||'';document.getElementById('editFacebook').value=settings.facebook||'';const lp=document.getElementById('logoPreview');if(settings.logo){lp.src=settings.logo;lp.classList.remove('hidden')}else lp.classList.add('hidden');const fp=document.getElementById('faviconPreview');if(settings.favicon){fp.src=settings.favicon;fp.classList.remove('hidden')}else fp.classList.add('hidden');const cpv=document.getElementById('coverPreview');if(settings.cover){cpv.src=settings.cover;cpv.classList.remove('hidden')}else cpv.classList.add('hidden');renderSectionsManager()}
    document.getElementById('closeAdmin').onclick=()=>document.getElementById('adminModal').classList.add('hidden');
    function compressImage(file,options){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/')){reject(new Error('ليس صورة'));return}const maxWidth=(options&&options.maxWidth)||800;const quality=(options&&options.quality)!=null?options.quality:0.7;const reader=new FileReader();reader.onerror=()=>reject(new Error('فشل القراءة'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('فشل التحميل'));img.onload=()=>{let w=img.width,h=img.height;if(w>maxWidth){h=Math.round(h*(maxWidth/w));w=maxWidth}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);function tryBlob(type,q){return new Promise(res=>canvas.toBlob(b=>res(b||null),type,q))}(async()=>{let type='image/webp';let blob=await tryBlob('image/webp',quality);if(!blob){type='image/jpeg';blob=await tryBlob('image/jpeg',quality)}if(!blob){reject(new Error('فشل الضغط'));return}let q=quality;while(blob.size>120*1024&&q>0.4){q-=0.1;const again=await tryBlob(type,q);if(again)blob=again;else break}const ext=type==='image/webp'?'webp':'jpg';resolve({blob,type,size:blob.size,ext,previewUrl:URL.createObjectURL(blob)})})()};img.src=reader.result};reader.readAsDataURL(file)})}
    async function uploadToStorage(blob,type,folder,ext){const name=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;const {error}=await sbClient.storage.from(STORAGE_BUCKET).upload(name,blob,{contentType:type,upsert:false,cacheControl:'3600'});if(error)throw error;const {data}=sbClient.storage.from(STORAGE_BUCKET).getPublicUrl(name);if(!data||!data.publicUrl)throw new Error('تعذر الرابط');return data.publicUrl}
    async function handleImagePick(file,opts,onDone){if(!file)return;try{showToast('جاري ضغط الصورة...');const c=await compressImage(file,opts);const kb=Math.round(c.size/1024);showToast('جاري الرفع ('+kb+' ك.ب)...');const url=await uploadToStorage(c.blob,c.type,(opts&&opts.folder)||'items',c.ext);onDone(url,kb,c.previewUrl)}catch(err){console.error(err);alert('تعذر رفع الصورة: '+(err.message||err))}}
    document.getElementById('logoUpload').onchange=e=>handleImagePick(e.target.files[0],{maxWidth:400,quality:0.75,folder:'logo'},(url,kb,prev)=>{document.getElementById('editLogo').value=url;const lp=document.getElementById('logoPreview');lp.src=prev||url;lp.classList.remove('hidden');showToast('تم رفع الشعار ('+kb+' ك.ب) — اضغط حفظ')});
    document.getElementById('coverUpload').onchange=e=>handleImagePick(e.target.files[0],{maxWidth:1200,quality:0.75,folder:'cover'},(url,kb,prev)=>{document.getElementById('editCover').value=url;const cp=document.getElementById('coverPreview');cp.src=prev||url;cp.classList.remove('hidden');showToast('تم رفع الغلاف ('+kb+' ك.ب) — اضغط حفظ')});
    document.getElementById('faviconUpload').onchange=e=>handleImagePick(e.target.files[0],{maxWidth:128,quality:0.75,folder:'favicon'},(url,kb,prev)=>{document.getElementById('editFavicon').value=url;const fp=document.getElementById('faviconPreview');fp.src=prev||url;fp.classList.remove('hidden');showToast('تم رفع الأيقونة ('+kb+' ك.ب) — اضغط حفظ')});
    document.getElementById('itemImageUpload').onchange=e=>handleImagePick(e.target.files[0],{maxWidth:800,quality:0.7,folder:'items'},(url,kb,prev)=>{document.getElementById('itemImage').value=url;const p=document.getElementById('itemImagePreview');p.src=prev||url;p.classList.remove('hidden');showToast('تم رفع الصورة ('+kb+' ك.ب)')});
    document.getElementById('editLogo').oninput=e=>{const lp=document.getElementById('logoPreview');if(e.target.value){lp.src=e.target.value;lp.classList.remove('hidden')}else lp.classList.add('hidden')};
    document.getElementById('editFavicon').oninput=e=>{const fp=document.getElementById('faviconPreview');if(e.target.value){fp.src=e.target.value;fp.classList.remove('hidden')}else fp.classList.add('hidden')};
    document.getElementById('itemImage').oninput=e=>{const p=document.getElementById('itemImagePreview');if(e.target.value){p.src=e.target.value;p.classList.remove('hidden')}else p.classList.add('hidden')};
    function renderSectionsManager(){const c=document.getElementById('sectionsManager');c.innerHTML='';sections.forEach(sec=>{const div=document.createElement('div');div.className='bg-chocolate-50 rounded-xl p-3';div.innerHTML='<div class="flex justify-between mb-2"><h4 class="font-bold text-sm">'+sec.icon+' '+sec.title+'</h4><span class="text-xs">'+sec.items.length+' أصناف</span></div><div class="flex flex-wrap gap-1.5">'+sec.items.map(i=>'<button class="text-xs bg-white border px-2 py-1 rounded-lg" data-id="'+i.id+'">'+i.name+'</button>').join('')+'<button class="text-xs bg-chocolate-200 px-2 py-1 rounded-lg add-in-cat" data-cat="'+sec.title+'" data-icon="'+sec.icon+'">+ إضافة</button></div>';c.appendChild(div);div.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>openEditItem(b.dataset.id));div.querySelectorAll('.add-in-cat').forEach(b=>b.onclick=()=>openEditItem(null,b.dataset.cat,b.dataset.icon))});const addNew=document.createElement('button');addNew.className='w-full mt-2 bg-green-600 text-white py-2 rounded-lg font-semibold';addNew.textContent='+ إضافة صنف';addNew.onclick=()=>openEditItem(null);c.appendChild(addNew)}
    function openEditItem(id,defCat,defIcon){currentEditId=id;const modal=document.getElementById('editItemModal');if(id){const item=items.find(i=>i.id===id);if(!item)return;document.getElementById('editItemTitle').textContent='تعديل: '+item.name;document.getElementById('itemName').value=item.name||'';document.getElementById('itemDesc').value=item.description||'';document.getElementById('itemPriceTRY').value=item.price_try??'';document.getElementById('itemPriceSYP').value=item.price_syp??'';document.getElementById('itemCategory').value=item.category||'';document.getElementById('itemCategoryIcon').value=item.category_icon||'';document.getElementById('itemImage').value=item.image_url||'';const prev=document.getElementById('itemImagePreview');if(item.image_url){prev.src=item.image_url;prev.classList.remove('hidden')}else prev.classList.add('hidden');document.getElementById('deleteItem').classList.remove('hidden')}else{document.getElementById('editItemTitle').textContent='إضافة صنف';document.getElementById('itemName').value='';document.getElementById('itemDesc').value='';document.getElementById('itemPriceTRY').value='';document.getElementById('itemPriceSYP').value='';document.getElementById('itemCategory').value=defCat||activeCategory||'';document.getElementById('itemCategoryIcon').value=defIcon||'🍽️';document.getElementById('itemImage').value='';document.getElementById('itemImagePreview').classList.add('hidden');document.getElementById('deleteItem').classList.add('hidden')}modal.classList.remove('hidden')}
    document.getElementById('closeEditItem').onclick=()=>document.getElementById('editItemModal').classList.add('hidden');
    document.getElementById('saveItem').onclick=async()=>{const name=document.getElementById('itemName').value.trim();const description=document.getElementById('itemDesc').value.trim();const price_try=parseFloat(document.getElementById('itemPriceTRY').value)||0;const price_syp=parseFloat(document.getElementById('itemPriceSYP').value)||0;const category=document.getElementById('itemCategory').value.trim()||'عام';const category_icon=document.getElementById('itemCategoryIcon').value.trim()||'🍽️';const image_url=document.getElementById('itemImage').value.trim();if(!name){alert('أدخل اسم الصنف');return}const payload={name,description,price_try,price_syp,category,category_icon,image_url};let error;if(currentEditId)({error}=await sbClient.from('menu_items').update(payload).eq('id',currentEditId));else({error}=await sbClient.from('menu_items').insert([payload]));if(error){alert('خطأ: '+error.message);return}showToast('تم الحفظ ✓');document.getElementById('editItemModal').classList.add('hidden');await loadItems()};
    document.getElementById('deleteItem').onclick=async()=>{if(!currentEditId||!confirm('حذف الصنف؟'))return;const {error}=await sbClient.from('menu_items').delete().eq('id',currentEditId);if(error){alert(error.message);return}showToast('تم الحذف');document.getElementById('editItemModal').classList.add('hidden');await loadItems()};
    async function upsertSetting(key,value){const {error}=await sbClient.from('site_settings').upsert({key,value,updated_at:new Date().toISOString()});return error}
    document.getElementById('saveSiteSettings').onclick=async()=>{const pairs={site_name:document.getElementById('editSiteName').value.trim()||'ركن الشوكلاتة',logo:document.getElementById('editLogo').value.trim(),favicon:document.getElementById('editFavicon').value.trim(),cover:document.getElementById('editCover').value.trim(),shop1_name:document.getElementById('editShop1Name').value.trim(),shop1_phone:document.getElementById('editShop1Phone').value.trim(),shop2_name:document.getElementById('editShop2Name').value.trim(),shop2_phone:document.getElementById('editShop2Phone').value.trim(),footer_desc:document.getElementById('editFooterDesc').value.trim(),whatsapp:document.getElementById('editWhatsapp').value.trim(),instagram:document.getElementById('editInstagram').value.trim(),facebook:document.getElementById('editFacebook').value.trim()};const np=document.getElementById('newAdminPassword').value.trim();const cp=document.getElementById('confirmAdminPassword').value.trim();if(np){if(np!==cp){alert('كلمة السر غير متطابقة');return}if(np.length<3){alert('3 أحرف على الأقل');return}pairs.admin_password=np}for(const [k,v] of Object.entries(pairs)){const err=await upsertSetting(k,v);if(err){alert('خطأ '+k+': '+err.message);return}}document.getElementById('newAdminPassword').value='';document.getElementById('confirmAdminPassword').value='';showToast('تم حفظ الإعدادات ✓');await loadSettings()};
    document.getElementById('adminModal').onclick=e=>{if(e.target.id==='adminModal')document.getElementById('adminModal').classList.add('hidden')};
    document.getElementById('editItemModal').onclick=e=>{if(e.target.id==='editItemModal')document.getElementById('editItemModal').classList.add('hidden')};
    loadAll();
  </script>
